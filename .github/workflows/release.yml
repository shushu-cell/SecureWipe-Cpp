name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: Release
            artifact: securewipe-linux.tar.gz
          - os: macos-latest
            config: Release
            artifact: securewipe-macos.zip
          - os: windows-latest
            config: Release
            artifact: securewipe-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build

      - name: Build
        shell: bash
        run: |
          cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        shell: bash
        run: |
          ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Install
        shell: bash
        run: |
          cmake --install build --config ${{ matrix.config }} --prefix staging

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf ${{ matrix.artifact }} -C staging .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd staging
          zip -9 -r ../${{ matrix.artifact }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path staging\* -DestinationPath ${{ matrix.artifact }} -Force

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}